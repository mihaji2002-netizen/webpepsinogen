name: Deploy to GitHub Pages

# Builds the Vite app and publishes it to GitHub Pages.
# Runs on pushes to the main branch, the feature branch, or manually.
on:
  push:
    branches:
      - main
      - cursor/top-secret-final-dossier-391d
  workflow_dispatch:

# Permissions required by the Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Base path must match the repo name for a GitHub Pages *project* site,
      # i.e. served from https://<user>.github.io/<repo>/.
      - name: Build
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      # SPA fallback: GitHub Pages has no server rewrites, so a copy of
      # index.html as 404.html makes deep links / refresh work.
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      # Force Pages into "workflow" (GitHub Actions) build type. Without this,
      # Pages can fall back to legacy branch mode and serve the repo root
      # (raw source) instead of our built `dist`, which 404s every data file.
      - name: Ensure Pages uses GitHub Actions build type
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Enable Pages in workflow mode (create if missing, else update).
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' || true
          curl -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
